# Збірка образу df-music (docker/acestep) → ghcr.io/<owner>/df-music:latest (публічний пакет, RunPod тягне без логіну).
name: df-music
on:
  workflow_dispatch:
    inputs:
      ace_ref: {description: "коміт/гілка ACE-Step-1.5", default: "main"}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Місце на диску (образ ~45 ГБ)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          sudo systemctl stop docker docker.socket containerd || true
          # усе сховище образів — на /mnt (на / лише ~20 ГБ): і docker, і containerd
          sudo mkdir -p /mnt/docker /mnt/containerd
          sudo rm -rf /var/lib/containerd && sudo ln -s /mnt/containerd /var/lib/containerd
          echo '{"data-root":"/mnt/docker","features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start containerd docker
          docker info --format 'root={{.DockerRootDir}} driver={{.Driver}}'
          df -h / /mnt
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build + push
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/df-music
          TAG=$(date +%Y%m%d)-${GITHUB_SHA::7}
          (while sleep 120; do df -h / /mnt | tail -2; done) &
          docker build --progress=plain --build-arg ACE_REF=${{ inputs.ace_ref }} -t $IMG:latest -t $IMG:$TAG docker/acestep
          df -h / /mnt
          docker push --all-tags $IMG
          docker inspect --format '{{.Size}}' $IMG:latest
