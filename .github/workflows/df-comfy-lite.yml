# Збірка образу df-comfy-lite (docker/comfy-lite) → ghcr.io/<owner>/df-comfy-lite:latest (публічний пакет).
# Лежить у репо haizerdev/df-runpod-images як .github/workflows/df-comfy-lite.yml; копія тут — для історії.
name: df-comfy-lite
on:
  workflow_dispatch:
    inputs:
      comfy_ref: {description: "коміт/гілка ComfyUI", default: "master"}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Місце на диску
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build + push
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/df-comfy-lite
          TAG=$(date +%Y%m%d)-${GITHUB_SHA::7}
          docker build --build-arg COMFY_REF=${{ inputs.comfy_ref }} -t $IMG:latest -t $IMG:$TAG docker/comfy-lite
          docker push --all-tags $IMG
          docker inspect --format '{{.Size}}' $IMG:latest
