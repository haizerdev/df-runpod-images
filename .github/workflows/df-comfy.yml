# Збірка образу df-comfy (docker/comfy) → ghcr.io/<owner>/df-comfy:latest (публічний пакет, RunPod тягне без логіну).
# Лежить у репо haizerdev/df-runpod-images як .github/workflows/df-comfy.yml; копія тут — для історії.
name: df-comfy
on:
  workflow_dispatch:
    inputs:
      comfy_ref: {description: "коміт/гілка ComfyUI", default: "master"}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Місце на диску (образ ~55 ГБ)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker && echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build + push
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/df-comfy
          TAG=$(date +%Y%m%d)-${GITHUB_SHA::7}
          docker build --build-arg COMFY_REF=${{ inputs.comfy_ref }} -t $IMG:latest -t $IMG:$TAG docker/comfy
          df -h / /mnt
          docker push --all-tags $IMG
          docker inspect --format '{{.Size}}' $IMG:latest
